// Run against Qt's generated Android Gradle project, not the repository root.
import groovy.json.JsonOutput

gradle.projectsEvaluated {
    rootProject.tasks.register('qshopperLicenseInventory') {
        doLast {
            def configuration = rootProject.configurations.getByName(
                    rootProject.findProperty('licenseConfiguration') ?: 'releaseRuntimeClasspath')
            def modules = configuration.resolvedConfiguration.resolvedArtifacts.collect { artifact ->
                [coordinate: artifact.moduleVersion.id.toString(), file: artifact.file.absolutePath]
            }.sort { it.coordinate }
            def files = configuration.files.collect { it.absolutePath }.sort()
            new File(rootProject.findProperty('licenseInventoryOutput')).text =
                    JsonOutput.prettyPrint(JsonOutput.toJson([modules: modules, files: files])) + '\n'
        }
    }
}
